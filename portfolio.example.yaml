# Copy to portfolio.yaml and replace with your real numbers.
# Prices are snapshots -- update them before you rely on any output.
#
# sleeve: groups positions for allocation targets. Anything you invent here
#         can be used as a research theme.
# account: "taxable" | "ira" | "401k" | "roth". Only taxable positions are
#          considered for funding cash needs, and only taxable sales are taxed.
# lots:   optional. Without them, tax estimates are zero and sell ordering
#         cannot prefer loss lots.

cash: 12000

marginal_tax_rate: 0.32   # ordinary income rate, for short-term gains
ltcg_rate: 0.15           # long-term capital gains rate

positions:
  - ticker: VOO
    shares: 210
    price: 545.00
    account: taxable
    sleeve: core
    lots:
      - shares: 120
        cost_basis_per_share: 395.00
        acquired: 2023-02-14
      - shares: 90
        cost_basis_per_share: 502.00
        acquired: 2025-11-03

  - ticker: TSLA
    shares: 340
    price: 318.00
    account: taxable
    sleeve: tesla
    lots:
      - shares: 200
        cost_basis_per_share: 182.00
        acquired: 2023-06-01
      - shares: 140
        cost_basis_per_share: 341.00
        acquired: 2026-02-20

  - ticker: NVDA
    shares: 95
    price: 176.00
    account: taxable
    sleeve: semiconductor
    lots:
      - shares: 95
        cost_basis_per_share: 118.00
        acquired: 2024-09-12

  - ticker: SMH
    shares: 40
    price: 288.00
    account: ira
    sleeve: semiconductor

  - ticker: IONQ
    shares: 900
    price: 42.00
    account: taxable
    sleeve: quantum
    lots:
      - shares: 900
        cost_basis_per_share: 51.00
        acquired: 2026-01-15

  - ticker: XLU
    shares: 150
    price: 88.00
    account: ira
    sleeve: utilities

# Known future liquidity requirements. Anything inside 12 months is carved out
# of the portfolio before growth targets are computed.
cash_needs:
  - amount: 25000
    date: 2026-10-15
    label: October cash requirement

# Target weights for the INVESTABLE remainder (after cash needs are reserved).
# These must sum to 1.0. The profile below is growth-tilted with a large index
# core -- adjust to taste, but keep the core meaningful.
targets:
  core: 0.45           # VOO or equivalent broad index
  semiconductor: 0.15
  utilities: 0.10
  tesla: 0.08
  quantum: 0.07
  spacex_proxy: 0.05   # see README -- SpaceX is private; read before funding
  cash: 0.10           # dry powder beyond the October reserve
